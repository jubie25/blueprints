blueprint:
  name: Warmwasser Legionellenschaltung (v1.4.0)
  description: >
    **Version: 1.4.0 (2026-09-27)**


    Wöchentliche Legionellenschaltung: Ab der Startzeit wird auf einen
    abgeschlossenen Warmwasserlauf der Wärmepumpe gewartet. Da deren
    Leistungsaufnahme Warmwasser- und Raumheizungsbetrieb nicht unterscheidet,
    wird stattdessen der Speichertemperatur-Sensor beobachtet: Ein Anstieg um
    das eingestellte Delta gegenüber dem zuletzt gesehenen Tiefstwert gilt als
    laufende Warmwasseraufheizung, ein anschließendes Ausbleiben weiterer
    neuer Höchstwerte über die Stabil-Zeit als deren Abschluss. Anschließend
    wird der Heizstab eingeschaltet, bis seine eigene Regelung bei
    Zieltemperatur abschaltet (Leistung fällt unter die Ende-Schwelle).
    Danach wird der Heizstab ausgeschaltet und der Vorgang beendet.


    Der Zustand wird in einem input_datetime-Helfer gehalten, sodass der
    Vorgang nach einem Neustart von Home Assistant am selben Tag fortgesetzt
    wird. Bei Problemen wird die konfigurierte Benachrichtigungs-Aktion
    ausgeführt (die Variablen `titel` und `nachricht` stehen dort zur
    Verfügung).


    **Benötigter Helfer:** ein `input_datetime` mit aktivierten Optionen
    "Datum" und "Uhrzeit" (Prozess-Speicher, robust gegen HA-Neustarts).


    **Änderungshistorie:**

    - 1.4.0 (2026-09-27): Zwei Logikfehler bei der Kontrolle gefunden und
      behoben: (1) Ein Tages-Timeout während Phase 1 wurde fälschlich als
      abgeschlossener Wärmepumpenlauf gewertet, sobald irgendwann ein
      Temperaturanstieg erkannt worden war, selbst wenn die Stabil-Zeit nie
      erreicht wurde. (2) Startete Home Assistant neu, während der Heizstab
      gerade erst eingeschaltet, seine Leistung aber noch nicht über die
      Schwelle gestiegen war, wurde er nach dem Neustart sofort wieder
      ausgeschaltet statt ihm die gewohnte 5-Minuten-Anlaufkulanz zu geben.

    - 1.3.0 (2026-09-27): Statusspeicher und Startzeitpunkt-Speicher zu
      einem einzigen input_datetime-Helfer zusammengelegt (der bisherige
      input_boolean-Schalter entfällt). Der gespeicherte Zeitwert dient
      zugleich als offen/geschlossen-Status (Platzhalterwert 1970-01-01
      00:00:00 = geschlossen) und als echter Startzeitpunkt. Zuvor stützte
      sich die Neustart-Erkennung auf `last_changed` des Statusspeichers;
      dieser Metadaten-Zeitstempel wird bei einem HA-Neustart aber auf den
      Neustart-Zeitpunkt zurückgesetzt, auch ohne echte Wertänderung -
      der jetzt verwendete, selbst gesetzte Wert ist dagegen
      neustart-resistent.

    - 1.2.0 (2026-09-26): Zeitmessung der Stabilitätsprüfung auf
      Unix-Zeitstempel umgestellt (robuster gegen Datentyp-Probleme bei
      Datum/Zeit-Vergleichen); Vergleich für "neuer Höchstwert" von `>=` auf
      `>` korrigiert, damit ein unveränderter Messwert korrekt als stabil
      zählt.

    - 1.1.0 (2026-09-24): Datentyp-Fehler bei der Zeitdifferenzberechnung
      behoben (`TypeError` bei `now() - stabil_seit`).

    - 1.0.0 (2026-09-23): Erkennung des Wärmepumpenlaufs von Leistungsmessung
      auf Speichertemperatur-Delta umgestellt, da die Wärmepumpen-Leistung
      Warmwasser- und Raumheizungsbetrieb nicht unterscheiden kann.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    entities:
      name: Entitäten
      icon: mdi:devices
      input:
        speicher:
          name: Temperatursensor Warmwasserspeicher
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        heizstab:
          name: Schalter Heizstab
          selector:
            entity:
              filter:
                - domain: switch
        heizstab_leistung:
          name: Leistungssensor Heizstab
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        flag_start:
          name: Prozess-Speicher (input_datetime)
          description: >
            Eigener Helfer vom Typ "Datum/Uhrzeit" (input_datetime, mit
            aktivierten Optionen "Datum" und "Uhrzeit"). Dient zugleich als
            Statusspeicher und als Zeitstempel: Enthält er den
            Startzeitpunkt von heute, gilt der Vorgang als offen; enthält er
            den festen Wert 1970-01-01 00:00:00, gilt er als geschlossen.
            Ein separater input_boolean-Schalter wird dadurch nicht mehr
            benötigt. Es wird bewusst kein Metadaten-Zeitstempel
            (last_changed) verwendet, da dieser bei einem
            Home-Assistant-Neustart auf den Neustart-Zeitpunkt
            zurückgesetzt wird, auch ohne echte Wertänderung.
          selector:
            entity:
              filter:
                - domain: input_datetime
    schedule:
      name: Zeitplan
      icon: mdi:calendar-clock
      input:
        startzeit:
          name: Startzeit
          description: >
            Ab dieser Uhrzeit wird auf den Wärmepumpen-Warmwasserlauf
            gewartet.
          default: "14:00:00"
          selector:
            time:
        wochentag:
          name: Wochentag(e)
          default:
            - sun
          selector:
            select:
              multiple: true
              options:
                - label: Montag
                  value: mon
                - label: Dienstag
                  value: tue
                - label: Mittwoch
                  value: wed
                - label: Donnerstag
                  value: thu
                - label: Freitag
                  value: fri
                - label: Samstag
                  value: sat
                - label: Sonntag
                  value: sun
    thresholds:
      name: Schwellwerte und Zeiten
      icon: mdi:tune
      collapsed: true
      input:
        ww_delta_start:
          name: Temperatur-Delta "Aufheizung erkannt"
          description: >
            Anstieg der Speichertemperatur gegenüber dem zuletzt gesehenen
            Tiefstwert, ab dem eine laufende Wärmepumpen-Warmwasseraufheizung
            angenommen wird (grenzt gegen den Effekt von warmem Rücklauf nach
            einer Zapfung ab).
          default: 0.8
          selector:
            number:
              min: 0.2
              max: 5
              step: 0.1
              unit_of_measurement: °C
              mode: box
        ww_pruef_intervall:
          name: Prüfintervall Speichertemperatur
          description: In diesem Abstand wird die Speichertemperatur ausgewertet.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
        ww_stabil_zeit:
          name: Stabil-Zeit nach letztem Höchstwert
          description: >
            So lange darf die Speichertemperatur keinen neuen Höchstwert mehr
            erreichen, damit der Wärmepumpenlauf als abgeschlossen gilt
            (überbrückt kurze Pausen/Abtauen).
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:
        hs_start_schwelle:
          name: Leistungsschwelle Heizstab "heizt"
          default: 100
          selector:
            number:
              min: 10
              max: 5000
              step: 10
              unit_of_measurement: W
              mode: box
        hs_ende_schwelle:
          name: Leistungsschwelle Heizstab "abgeschaltet"
          description: Darunter hat die Regelung des Heizstabs abgeschaltet.
          default: 10
          selector:
            number:
              min: 0
              max: 500
              step: 1
              unit_of_measurement: W
              mode: box
        hs_ende_zeit:
          name: Ende-Zeit Heizstab
          description: So lange muss die Leistung unter der Ende-Schwelle bleiben.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
        hs_max_dauer:
          name: Maximale Heizdauer
          description: Sicherheits-Timeout, danach wird der Heizstab ausgeschaltet.
          default:
            hours: 4
            minutes: 0
            seconds: 0
          selector:
            duration:
        ziel_temp:
          name: Ziel-Temperatur
          description: Liegt der Speicher am Ende darunter, wird benachrichtigt.
          default: 60
          selector:
            number:
              min: 40
              max: 80
              step: 1
              unit_of_measurement: °C
              mode: box
    notification:
      name: Benachrichtigung
      icon: mdi:bell
      input:
        benachrichtigung:
          name: Benachrichtigungs-Aktion
          description: >
            Aktion(en), die bei Problemen ausgeführt werden, z. B. ein
            Notify-Dienst mit `title: "{{ titel }}"` und
            `message: "{{ nachricht }}"`. Leer lassen für keine Benachrichtigung.
          default: []
          selector:
            action:

mode: single

variables:
  blueprint_version: "1.4.0"
  speicher: !input speicher
  heizstab: !input heizstab
  heizstab_leistung: !input heizstab_leistung
  flag_start: !input flag_start
  hs_start_schwelle: !input hs_start_schwelle
  ziel_temp: !input ziel_temp

triggers:
  - trigger: time
    at: !input startzeit
    id: start
  - trigger: homeassistant
    event: start
    id: resume

actions:
  # Start-Trigger nur an den gewählten Wochentagen
  - if:
      - condition: trigger
        id: start
      - condition: not
        conditions:
          - condition: time
            weekday: !input wochentag
    then:
      - stop: "Falscher Wochentag"

  # Nach Neustart nur fortsetzen, wenn im Prozess-Speicher ein Startzeitpunkt
  # von heute steht (alles andere - Platzhalterwert, alter Tag, unbekannt -
  # gilt als "kein offener Vorgang"). Bewusst NICHT über
  # states[...].last_changed geprüft: last_changed wird bei einem
  # HA-Neustart auf den Neustart-Zeitpunkt zurückgesetzt, auch wenn sich der
  # Wert nicht geändert hat. Der selbst gesetzte Wert übersteht Neustarts
  # korrekt.
  - if:
      - condition: trigger
        id: resume
      - condition: template
        value_template: >
          {% set start_wert = states(flag_start) %}
          {{ start_wert in ['unknown', 'unavailable']
             or as_datetime(start_wert).date() != now().date() }}
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ flag_start }}"
        data:
          datetime: "1970-01-01 00:00:00"
      - stop: "Nichts fortzusetzen"

  # Vorgang als offen markieren: echten Startzeitpunkt festhalten
  - if:
      - condition: trigger
        id: start
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ flag_start }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # Phase 1: abgeschlossenen Wärmepumpen-Warmwasserlauf abwarten
  # (übersprungen, wenn der Heizstab nach einem Neustart bereits läuft)
  - if:
      - condition: template
        value_template: "{{ is_state(heizstab, 'off') }}"
    then:
      - variables:
          ww_delta_start: !input ww_delta_start
          ww_stabil_zeit: !input ww_stabil_zeit
          ww_pruef_intervall: !input ww_pruef_intervall
          ww_stabil_zeit_sek: >
            {% set d = ww_stabil_zeit %}
            {{ (d.hours | default(0)) * 3600
               + (d.minutes | default(0)) * 60
               + (d.seconds | default(0)) }}
          phase1_start: "{{ now().timestamp() }}"
          phase1_timeout_sek: >
            {{ (today_at('23:59:59') - now()).total_seconds() | int }}
          ref_min: "{{ states(speicher) | float(0) }}"
          max_seit_start: "{{ states(speicher) | float(0) }}"
          heizung_erkannt: false
          stabil_seit: "{{ now().timestamp() }}"
      - repeat:
          while:
            - condition: template
              value_template: >
                {{ not (heizung_erkannt
                        and (now().timestamp() - stabil_seit) >= ww_stabil_zeit_sek)
                   and (now().timestamp() - phase1_start) < phase1_timeout_sek }}
          sequence:
            - delay: "{{ ww_pruef_intervall }}"
            - variables:
                aktuelle_temp: "{{ states(speicher) | float(max_seit_start) }}"
                ref_min: "{{ [ref_min, aktuelle_temp] | min }}"
                heizung_erkannt: >
                  {{ heizung_erkannt or (aktuelle_temp - ref_min) >= ww_delta_start }}
                neuer_hoechststand: "{{ aktuelle_temp > max_seit_start }}"
                max_seit_start: "{{ [max_seit_start, aktuelle_temp] | max }}"
                stabil_seit: "{{ now().timestamp() if neuer_hoechststand else stabil_seit }}"
      # Nur wenn die Schleife wegen erreichter Stabilität endete (nicht wegen
      # Tages-Timeout) gilt der Wärmepumpenlauf als abgeschlossen. Ein
      # Timeout, bei dem zwar ein Anstieg erkannt, aber nie eine Stabil-Zeit
      # erreicht wurde, zählt bewusst NICHT als abgeschlossen.
      - if:
          - condition: template
            value_template: >
              {{ not (heizung_erkannt
                      and (now().timestamp() - stabil_seit) >= ww_stabil_zeit_sek) }}
        then:
          - variables:
              titel: Legionellenschaltung
              nachricht: >
                Heute kein abgeschlossener Wärmepumpen-Warmwasserlauf
                erkannt (entweder kein ausreichender Temperaturanstieg oder
                keine anschließende Stabilisierung bis Tagesende), Heizstab
                wurde nicht gestartet.
                (Blueprint v{{ blueprint_version }})
          - repeat:
              count: 1
              sequence: !input benachrichtigung
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ flag_start }}"
            data:
              datetime: "1970-01-01 00:00:00"
          - stop: "Timeout Wärmepumpen-Warmwasserlauf"
      # Heizstab einschalten
      - action: switch.turn_on
        target:
          entity_id: "{{ heizstab }}"

  # Anlauf-Kulanz: gilt sowohl nach frischem Einschalten oben als auch nach
  # einem Neustart, bei dem der Heizstab bereits an ist, aber seine Leistung
  # noch nicht über die Schwelle gestiegen ist (sonst würde Phase 2 unten
  # fälschlich "schon fertig" annehmen und sofort wieder abschalten).
  - wait_template: >
      {{ states(heizstab_leistung) | float(0) > hs_start_schwelle | float }}
    timeout: "00:05:00"
    continue_on_timeout: true

  # Phase 2: warten, bis die Heizstab-Regelung abgeschaltet hat
  - if:
      - condition: template
        value_template: >
          {{ states(heizstab_leistung) | float(0) > hs_start_schwelle | float }}
    then:
      - wait_for_trigger:
          - trigger: numeric_state
            entity_id: !input heizstab_leistung
            below: !input hs_ende_schwelle
            for: !input hs_ende_zeit
        timeout: !input hs_max_dauer
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.trigger is none }}"
        then:
          - variables:
              titel: Legionellenschaltung
              nachricht: >
                Heizstab hat nicht innerhalb der maximalen Heizdauer
                abgeschaltet und wird jetzt ausgeschaltet.
                Speicher: {{ states(speicher) }} °C
                (Blueprint v{{ blueprint_version }})
          - repeat:
              count: 1
              sequence: !input benachrichtigung

  # Abschluss
  - action: switch.turn_off
    target:
      entity_id: "{{ heizstab }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: "{{ flag_start }}"
    data:
      datetime: "1970-01-01 00:00:00"
  - if:
      - condition: template
        value_template: "{{ states(speicher) | float(0) < ziel_temp | float }}"
    then:
      - variables:
          titel: Legionellenschaltung
          nachricht: >
            Zieltemperatur nicht erreicht: {{ states(speicher) }} °C
            (Blueprint v{{ blueprint_version }})
      - repeat:
          count: 1
          sequence: !input benachrichtigung
