blueprint:
  name: Warmwasser Legionellenschaltung (v1.7.0)
  description: |-
    **Version: 1.7.0 (2026-10-03)** - [Änderungshistorie (CHANGELOG.md)](https://github.com/jubie25/blueprints/blob/main/automation/Legionellensteuerung/CHANGELOG.md)

    Wöchentliche Legionellenschaltung: Ab der Startzeit wird auf einen
    abgeschlossenen Warmwasserlauf der Wärmepumpe gewartet. Da deren
    Leistungsaufnahme Warmwasser- und Raumheizungsbetrieb nicht unterscheidet,
    wird stattdessen der Speichertemperatur-Sensor beobachtet: Ein Anstieg um
    das eingestellte Delta gegenüber dem zuletzt gesehenen Tiefstwert gilt als
    laufende Warmwasseraufheizung, ein anschließendes Ausbleiben weiterer
    neuer Höchstwerte über die Stabil-Zeit als deren Abschluss. Anschließend
    wird der Heizstab eingeschaltet, bis seine eigene Regelung bei
    Zieltemperatur abschaltet (Leistung fällt unter die Ende-Schwelle).
    Danach wird der Heizstab ausgeschaltet und der Vorgang beendet.

    Der Zustand wird in einem input_datetime-Helfer gehalten, sodass der
    Vorgang nach einem Neustart von Home Assistant am selben Tag fortgesetzt
    wird. Wichtige Schritte werden im Logbuch protokolliert (Quelle
    "Legionellenschaltung"). Bei Problemen wird die konfigurierte
    Benachrichtigungs-Aktion ausgeführt (die Variablen `titel` und `nachricht`
    stehen dort zur Verfügung).

    **Benötigter Helfer:** ein `input_datetime` mit aktivierten Optionen
    "Datum" und "Uhrzeit" (Prozess-Speicher, robust gegen HA-Neustarts).
  domain: automation
  homeassistant:
    min_version: 2025.4.0
  input:
    entities:
      name: Entitäten
      icon: mdi:devices
      input:
        speicher:
          name: Temperatursensor Warmwasserspeicher
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              multiple: false
              reorder: false
        heizstab:
          name: Schalter Heizstab
          selector:
            entity:
              filter:
              - domain:
                - switch
              multiple: false
              reorder: false
        heizstab_leistung:
          name: Leistungssensor Heizstab
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - power
              multiple: false
              reorder: false
        flag_start:
          name: Prozess-Speicher (input_datetime)
          description: 'Eigener Helfer vom Typ "Datum/Uhrzeit" (input_datetime, mit
            aktivierten Optionen "Datum" und "Uhrzeit"). Dient zugleich als Statusspeicher
            und als Zeitstempel: Enthält er den Startzeitpunkt von heute, gilt der
            Vorgang als offen; enthält er den festen Wert 1970-01-01 00:00:00, gilt
            er als geschlossen. Ein separater input_boolean-Schalter wird dadurch
            nicht mehr benötigt. Es wird bewusst kein Metadaten-Zeitstempel (last_changed)
            verwendet, da dieser bei einem Home-Assistant-Neustart auf den Neustart-Zeitpunkt
            zurückgesetzt wird, auch ohne echte Wertänderung.

            '
          selector:
            entity:
              filter:
              - domain:
                - input_datetime
              multiple: false
              reorder: false
    schedule:
      name: Zeitplan
      icon: mdi:calendar-clock
      input:
        startzeit:
          name: Startzeit
          description: 'Ab dieser Uhrzeit wird auf den Wärmepumpen-Warmwasserlauf
            gewartet.

            '
          default: '14:00:00'
          selector:
            time: {}
        wochentag:
          name: Wochentag(e)
          default:
          - sun
          selector:
            select:
              multiple: true
              options:
              - label: Montag
                value: mon
              - label: Dienstag
                value: tue
              - label: Mittwoch
                value: wed
              - label: Donnerstag
                value: thu
              - label: Freitag
                value: fri
              - label: Samstag
                value: sat
              - label: Sonntag
                value: sun
              custom_value: false
              sort: false
    thresholds:
      name: Schwellwerte und Zeiten
      icon: mdi:tune
      collapsed: true
      input:
        ww_delta_start:
          name: Temperatur-Delta "Aufheizung erkannt"
          description: 'Anstieg der Speichertemperatur gegenüber dem zuletzt gesehenen
            Tiefstwert, ab dem eine laufende Wärmepumpen-Warmwasseraufheizung angenommen
            wird (grenzt gegen den Effekt von warmem Rücklauf nach einer Zapfung ab).

            '
          default: 0.8
          selector:
            number:
              min: 0.2
              max: 5.0
              step: 0.1
              unit_of_measurement: °C
              mode: box
        ww_pruef_intervall:
          name: Prüfintervall Speichertemperatur
          description: In diesem Abstand wird die Speichertemperatur ausgewertet.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
              enable_second: true
        ww_stabil_zeit:
          name: Stabil-Zeit nach letztem Höchstwert
          description: 'So lange darf die Speichertemperatur keinen neuen Höchstwert
            mehr erreichen, damit der Wärmepumpenlauf als abgeschlossen gilt (überbrückt
            kurze Pausen/Abtauen).

            '
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:
              enable_second: true
        hs_start_schwelle:
          name: Leistungsschwelle Heizstab "heizt"
          default: 100
          selector:
            number:
              min: 10.0
              max: 5000.0
              step: 10.0
              unit_of_measurement: W
              mode: box
        hs_ende_schwelle:
          name: Leistungsschwelle Heizstab "abgeschaltet"
          description: Darunter hat die Regelung des Heizstabs abgeschaltet.
          default: 10
          selector:
            number:
              min: 0.0
              max: 500.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        hs_ende_zeit:
          name: Ende-Zeit Heizstab
          description: So lange muss die Leistung unter der Ende-Schwelle bleiben.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
              enable_second: true
        hs_max_dauer:
          name: Maximale Heizdauer
          description: Sicherheits-Timeout, danach wird der Heizstab ausgeschaltet.
          default:
            hours: 4
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_second: true
        ziel_temp:
          name: Ziel-Temperatur
          description: Liegt der Speicher am Ende darunter, wird benachrichtigt.
          default: 60
          selector:
            number:
              min: 40.0
              max: 80.0
              step: 1.0
              unit_of_measurement: °C
              mode: box
    notification:
      name: Benachrichtigung
      icon: mdi:bell
      input:
        benachrichtigung:
          name: Benachrichtigungs-Aktion
          description: 'Aktion(en), die bei Problemen ausgeführt werden, z. B. ein
            Notify-Dienst mit `title: "{{ titel }}"` und `message: "{{ nachricht }}"`.
            Leer lassen für keine Benachrichtigung.

            '
          default: []
          selector:
            action: {}
  source_url: https://github.com/jubie25/blueprints/blob/main/automation/Legionellensteuerung/legionella_heater_control.yaml
mode: single
max_exceeded: silent
variables:
  blueprint_version: 1.7.0
  speicher: !input speicher
  heizstab: !input heizstab
  heizstab_leistung: !input heizstab_leistung
  flag_start: !input flag_start
  hs_start_schwelle: !input hs_start_schwelle
  ziel_temp: !input ziel_temp
triggers:
- trigger: time
  at: !input startzeit
  id: start
- trigger: homeassistant
  event: start
  id: resume
- trigger: event
  event_type: automation_reloaded
  id: resume
actions:
- if:
  - condition: trigger
    id: start
  - condition: not
    conditions:
    - condition: time
      weekday: !input wochentag
  then:
  - stop: Falscher Wochentag
- if:
  - condition: trigger
    id: resume
  then:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {% set w = states(flag_start) %}
          {{ w in ['unknown', 'unavailable'] or w.startswith('1970-01-01') }}
      sequence:
      - stop: Kein offener Vorgang
    - conditions:
      - condition: template
        value_template: '{{ as_datetime(states(flag_start)).date() != now().date() }}'
      sequence:
      - variables:
          alt_start: '{{ states(flag_start) }}'
      - action: switch.turn_off
        target:
          entity_id: '{{ heizstab }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: '{{ flag_start }}'
        data:
          datetime: '1970-01-01 00:00:00'
      - variables:
          titel: Legionellenschaltung
          nachricht: >-
            Ein am {{ alt_start }} begonnener Vorgang wurde nicht abgeschlossen
            (z. B. Abbruch durch Neustart oder Neuladen). Der Heizstab wurde
            vorsichtshalber ausgeschaltet und der Vorgang zurückgesetzt.
            (Blueprint v{{ blueprint_version }})
      - repeat:
          count: 1
          sequence: !input benachrichtigung
      - action: logbook.log
        continue_on_error: true
        data:
          name: Legionellenschaltung
          message: 'Verwaister Vorgang von {{ alt_start }} zurückgesetzt, Heizstab
            ausgeschaltet'
      - stop: Verwaister Vorgang zurückgesetzt
- if:
  - condition: trigger
    id: start
  then:
  - action: input_datetime.set_datetime
    target:
      entity_id: '{{ flag_start }}'
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
- if:
  - condition: template
    value_template: '{{ is_state(heizstab, ''off'') }}'
  then:
  - variables:
      ww_delta_start: !input ww_delta_start
      ww_stabil_zeit: !input ww_stabil_zeit
      ww_pruef_intervall: !input ww_pruef_intervall
      ww_stabil_zeit_sek: >-
        {% set d = ww_stabil_zeit %}
        {% if d is mapping %}
          {{ d.get('days', 0) | float(0) * 86400
             + d.get('hours', 0) | float(0) * 3600
             + d.get('minutes', 0) | float(0) * 60
             + d.get('seconds', 0) | float(0) }}
        {% elif d is string %}
          {% set p = d.split(':') %}
          {% if p | length == 3 %}
            {{ p[0] | float(0) * 3600 + p[1] | float(0) * 60 + p[2] | float(0) }}
          {% elif p | length == 2 %}
            {{ p[0] | float(0) * 60 + p[1] | float(0) }}
          {% else %}
            {{ d | float(0) }}
          {% endif %}
        {% elif d.total_seconds is defined %}
          {{ d.total_seconds() }}
        {% else %}
          {{ d | float(0) }}
        {% endif %}
      phase1_start: '{{ now().timestamp() }}'
      phase1_timeout_sek: '{{ (today_at(''23:59:59'') - now()).total_seconds() | int
        }}

        '
      ref_min: '{{ states(speicher) | float(999) }}'
      max_seit_start: '{{ states(speicher) | float(999) }}'
      heizung_erkannt: false
      stabil_seit: '{{ now().timestamp() }}'
  - if:
    - condition: template
      value_template: '{{ ww_stabil_zeit_sek | float(0) <= 0 }}'
    then:
    - variables:
        titel: Legionellenschaltung
        nachricht: 'Die Stabil-Zeit konnte nicht gelesen werden oder ist 0 (Wert:
          {{ ww_stabil_zeit }}). Zur Sicherheit wurde der Heizstab nicht gestartet.
          (Blueprint v{{ blueprint_version }})

          '
    - repeat:
        count: 1
        sequence: !input benachrichtigung
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ flag_start }}'
      data:
        datetime: '1970-01-01 00:00:00'
    - stop: Stabil-Zeit ungültig
  - action: logbook.log
    continue_on_error: true
    data:
      name: Legionellenschaltung
      message: 'Phase 1 gestartet (v{{ blueprint_version }}): Speicher {{ states(speicher)
        }} °C, Delta {{ ww_delta_start }} °C, Stabil-Zeit {{ ww_stabil_zeit_sek |
        int }} s'
  - repeat:
      while:
      - condition: template
        value_template: "{{ not (heizung_erkannt\n        and (now().timestamp() -
          stabil_seit) >= ww_stabil_zeit_sek)\n   and (now().timestamp() - phase1_start)
          < phase1_timeout_sek }}\n"
      sequence:
      - delay: '{{ ww_pruef_intervall }}'
      - variables:
          messwert_ok: '{{ states(speicher) not in [''unknown'', ''unavailable''] }}'
          aktuelle_temp: '{{ states(speicher) | float(ref_min) if messwert_ok else ref_min
            }}'
          ref_min: '{{ [ref_min, aktuelle_temp] | min }}'
          neu_erkannt: '{{ not heizung_erkannt and (aktuelle_temp - ref_min) >= ww_delta_start
            }}'
          zurueckgefallen: '{{ heizung_erkannt and messwert_ok and aktuelle_temp < ref_min
            + ww_delta_start / 2 }}'
          stabil_reset: '{{ not messwert_ok or neu_erkannt or (heizung_erkannt and aktuelle_temp
            > max_seit_start) }}'
          heizung_erkannt: '{{ (heizung_erkannt and not zurueckgefallen) or neu_erkannt
            }}'
          max_seit_start: '{{ aktuelle_temp if (neu_erkannt or not heizung_erkannt) else
            [max_seit_start, aktuelle_temp] | max }}'
          stabil_seit: '{{ now().timestamp() if (stabil_reset or not heizung_erkannt) else
            stabil_seit }}'
      - if:
        - condition: template
          value_template: '{{ zurueckgefallen }}'
        then:
        - action: logbook.log
          continue_on_error: true
          data:
            name: Legionellenschaltung
            message: 'Temperatur ist wieder auf {{ aktuelle_temp }} °C gefallen (Tiefstwert
              {{ ref_min }} °C): kurzer Ausschlag, kein Wärmepumpenlauf. Erkennung zurückgesetzt.'
      - if:
        - condition: template
          value_template: '{{ neu_erkannt }}'
        then:
        - action: logbook.log
          continue_on_error: true
          data:
            name: Legionellenschaltung
            message: 'Aufheizung erkannt: Speicher {{ aktuelle_temp }} °C, Anstieg {{
              (aktuelle_temp - ref_min) | round(2) }} K über Tiefstwert {{ ref_min }}
              °C. Warte jetzt auf Stabilisierung ({{ ww_stabil_zeit_sek | int }} s ohne
              neuen Höchstwert).'
  - if:
    - condition: template
      value_template: "{{ not (heizung_erkannt\n        and (now().timestamp() - stabil_seit)
        >= ww_stabil_zeit_sek) }}\n"
    then:
    - variables:
        titel: Legionellenschaltung
        nachricht: 'Heute kein abgeschlossener Wärmepumpen-Warmwasserlauf erkannt
          (entweder kein ausreichender Temperaturanstieg oder keine anschließende
          Stabilisierung bis Tagesende), Heizstab wurde nicht gestartet. (Blueprint
          v{{ blueprint_version }})

          '
    - repeat:
        count: 1
        sequence: !input benachrichtigung
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ flag_start }}'
      data:
        datetime: '1970-01-01 00:00:00'
    - stop: Timeout Wärmepumpen-Warmwasserlauf
  - action: logbook.log
    continue_on_error: true
    data:
      name: Legionellenschaltung
      message: 'Heizstab wird eingeschaltet: Höchstwert {{ max_seit_start }} °C,
        seit {{ (now().timestamp() - stabil_seit) | int }} s kein neuer Höchstwert
        (erforderlich: {{ ww_stabil_zeit_sek | int }} s)'
  - action: switch.turn_on
    target:
      entity_id: '{{ heizstab }}'
- wait_template: '{{ states(heizstab_leistung) | float(0) > hs_start_schwelle | float
    }}

    '
  timeout: 00:05:00
  continue_on_timeout: true
- if:
  - condition: template
    value_template: '{{ states(heizstab_leistung) | float(0) > hs_start_schwelle |
      float }}

      '
  then:
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id: !input heizstab_leistung
      below: !input hs_ende_schwelle
      for: !input hs_ende_zeit
    timeout: !input hs_max_dauer
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.trigger is none }}'
    then:
    - variables:
        titel: Legionellenschaltung
        nachricht: 'Heizstab hat nicht innerhalb der maximalen Heizdauer abgeschaltet
          und wird jetzt ausgeschaltet. Speicher: {{ states(speicher) }} °C (Blueprint
          v{{ blueprint_version }})

          '
    - repeat:
        count: 1
        sequence: !input benachrichtigung
- action: switch.turn_off
  target:
    entity_id: '{{ heizstab }}'
- action: input_datetime.set_datetime
  target:
    entity_id: '{{ flag_start }}'
  data:
    datetime: '1970-01-01 00:00:00'
- if:
  - condition: template
    value_template: '{{ states(speicher) | float(0) < ziel_temp | float }}'
  then:
  - variables:
      titel: Legionellenschaltung
      nachricht: 'Zieltemperatur nicht erreicht: {{ states(speicher) }} °C (Blueprint
        v{{ blueprint_version }})

        '
  - repeat:
      count: 1
      sequence: !input benachrichtigung
