# Blueprint version: 1.1
blueprint:
  name: Device off after going idle (power monitored)
  description: >
    v1.1
    Turns off a device via a switch when it's
    power consumption is below a threshold for a set time - 
    whether the device was never active or a process has already been completed. 
    Reboot-safe by one persistent timer helper.
  domain: automation
  source_url: https://github.com/jubie25/blueprints/blob/main/automation/switch_off_device_when_idle/switch_off_device_when_idle.yaml
  input:
    device_switch:
      name: Schalter
      description: Schalter, der das Gerät steuert (z. B. Shelly)
      selector:
        entity:
          domain: switch

    power_sensor:
      name: Leistungssensor
      description: Sensor, der die aktuelle Leistungsaufnahme misst
      selector:
        entity:
          domain: sensor
          device_class: power

    power_threshold:
      name: Schwellwert (Watt)
      description: Leistung unterhalb dieses Werts gilt als "inaktiv"
      default: 3
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: W
          mode: box

    idle_timeout:
      name: Inaktivitäts-Dauer
      description: Zeit ohne Aktivität, nach der ausgeschaltet wird
      default:
        minutes: 15
      selector:
        duration: {}

    idle_timer:
      name: Timer-Helfer
      description: >
        Vorab angelegter Timer-Helfer (Einstellungen → Helfer → Timer),
        der ausschließlich dieser Automation zugeordnet ist.
        Die dort hinterlegte Dauer wird ignoriert und stattdessen
        immer die Dauer aus "Inaktivitäts-Dauer" verwendet.
      selector:
        entity:
          domain: timer

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input device_switch
    to: "on"
    id: switch_on
  - trigger: state
    entity_id: !input device_switch
    to: "off"
    id: switch_off
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input power_threshold
    id: aktivitaet_start
  - trigger: numeric_state
    entity_id: !input power_sensor
    below: !input power_threshold
    id: aktivitaet_ende
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input idle_timer
    id: timer_ab
  - trigger: state
    entity_id: !input device_switch
    from: "unavailable"
    id: reconnect
    
variables:
  device_switch: !input device_switch
  idle_timer: !input idle_timer
  idle_timeout: !input idle_timeout

actions:
  - choose:
      # Schalter geht an -> Timer starten
      - conditions:
          - condition: trigger
            id: switch_on
        sequence:
          - action: timer.start
            target: { entity_id: "{{ idle_timer }}" }
            data:
              duration: "{{ idle_timeout }}"

      # Schalter geht aus, oder Aktivität beginnt -> Timer stoppen
      - conditions:
          - condition: trigger
            id: [switch_off, aktivitaet_start]
        sequence:
          - action: timer.cancel
            target: { entity_id: "{{ idle_timer }}" }

      # Aktivität endet -> Timer neu starten, sofern noch an
      - conditions:
          - condition: trigger
            id: aktivitaet_ende
          - condition: state
            entity_id: !input device_switch
            state: "on"
        sequence:
          - action: timer.start
            target: { entity_id: "{{ idle_timer }}" }
            data:
              duration: "{{ idle_timeout }}"

      # HA-Neustart: Schalter an, aber kein Timer aktiv -> nachholen
      - conditions:
          - condition: trigger
            id: ha_start
          - condition: state
            entity_id: !input device_switch
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: !input idle_timer
                state: "active"
        sequence:
          - action: timer.start
            target: { entity_id: "{{ idle_timer }}" }
            data:
              duration: "{{ idle_timeout }}"

      # Timer abgelaufen -> ausschalten
      - conditions:
          - condition: trigger
            id: timer_ab
          - condition: state
            entity_id: !input device_switch
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input device_switch
              
      # Gerät wieder erreichbar, Timer war zwischenzeitlich abgelaufen -> nachholen
      - conditions:
          - condition: trigger
            id: reconnect
          - condition: state
            entity_id: !input device_switch
            state: "on"
          - condition: numeric_state
            entity_id: !input power_sensor
            below: !input power_threshold
          - condition: state
            entity_id: !input idle_timer
            state: "idle"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input device_switch
