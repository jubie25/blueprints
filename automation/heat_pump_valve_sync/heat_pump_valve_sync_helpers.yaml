# Helfer für den Blueprint "Wärmepumpe – Ventil-Synchronisation".
# Als Package einbinden (homeassistant: packages: !include_dir_named packages).
# Nach dem ersten Start "WP Ventil-Sync aktiv" bewusst einschalten
# (Standard: aus = Rückfallmodus, die Ventile folgen direkt dem Bedarf).
#
# Namensschema: Friendly Name deutsch, Entity-ID englisch, Raum zuerst.
#   input_boolean.<regler>_heat_demand   Bedarf eines Reglers (Blueprint: "demand")
#   switch.<regler>_heater_adapter       Adapter, im jeweiligen Generic Thermostat als Heizer eintragen
# Pro Regler genau ein Bedarfsschalter und ein Adapter. Ein Adapter darf nie von zwei
# Reglern geschaltet werden, sie würden sich gegenseitig überschreiben.
# Der Generic Thermostat akzeptiert als Heizer nur Schalter, daher der Adapter.

input_boolean:
  heat_pump_valve_sync_running:
    name: WP Ventil-Sync Lauf aktiv
    icon: mdi:heat-pump
  heat_pump_valve_sync_release:
    name: WP Ventil-Sync Freigabe aktiv
    icon: mdi:valve-open
  heat_pump_valve_sync_enabled:
    name: WP Ventil-Sync aktiv
    icon: mdi:sync

  ugwr_heat_demand:
    name: UGWR Wärmebedarf
    icon: mdi:radiator
  kino_fenster_heat_demand:
