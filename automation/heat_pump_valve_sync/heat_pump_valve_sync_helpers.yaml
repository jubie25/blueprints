template:
  - switch:
      - name: "UGWR Heizer-Adapter"
        unique_id: ugwr_heater_adapter
        default_entity_id: switch.ugwr_heater_adapter
        state: "{{ is_state('input_boolean.ugwr_heat_demand', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.ugwr_heat_demand
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.ugwr_heat_demand
