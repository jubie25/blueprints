# Monitoring für den Blueprint "Wärmepumpe – Ventil-Synchronisation" (optional)
# Version: 1.6.0
#
# Als zweites Package neben heat_pump_valve_sync_helpers.yaml einbinden
# (homeassistant: packages: !include_dir_named packages).
# Die Sensoren lesen nur, sie schalten nichts.
#
# Einstellungen (Zuordnung, Helfer, Mindestpause, Verzögerungen usw.) kommen aus der
# Automatisierung: Der Blueprint (ab 1.3.0) sendet sie als Ereignis
# "heat_pump_valve_sync_config", der Sensor "WP Ventil-Sync Konfiguration" speichert sie.
# Nach dem Einbinden dauert es bis zum nächsten Sicherheitstakt (Standard 5 min), bis die
# Werte da sind. Sofort geht es mit "Automatisierungen neu laden".
#
# Einzige feste Einstellung: die beiden history_stats-Sensoren ganz unten brauchen die
# Entity-ID des Helfers "Lauf aktiv" (dort sind keine Templates erlaubt).

template:
  # Einstellungen der Automatisierung, empfangen per Ereignis.
  - triggers:
      - trigger: event
        event_type: heat_pump_valve_sync_config
    sensor:
      - name: "WP Ventil-Sync Konfiguration"
        unique_id: heat_pump_valve_sync_config
        default_entity_id: sensor.heat_pump_valve_sync_config
        icon: mdi:cog-outline
        state: "{{ trigger.event.data.version | default('unbekannt') }}"
        attributes:
          rooms: "{{ trigger.event.data.rooms | default([]) }}"
          bypass_valves: "{{ trigger.event.data.bypass_valves | default([]) }}"
          always_open_valves: "{{ trigger.event.data.always_open_valves | default([]) }}"
          invert_valves: "{{ trigger.event.data.invert_valves | default(false) }}"
          power_sensor: "{{ trigger.event.data.power_sensor | default(none) }}"
          run_threshold: "{{ trigger.event.data.run_threshold | default(none) }}"
          run_on_delay: "{{ trigger.event.data.run_on_delay | default(none) }}"
          run_off_delay: "{{ trigger.event.data.run_off_delay | default(none) }}"
          run_helper: "{{ trigger.event.data.run_helper | default(none) }}"
          release_helper: "{{ trigger.event.data.release_helper | default(none) }}"
          sync_enabled: "{{ trigger.event.data.sync_enabled | default(none) }}"
          min_rooms: "{{ trigger.event.data.min_rooms | default(none) }}"
          min_pause: "{{ trigger.event.data.min_pause | default(none) }}"
          max_wait: "{{ trigger.event.data.max_wait | default(none) }}"
          max_release: "{{ trigger.event.data.max_release | default(none) }}"

  # Dauer der Läufe pro Tag (Durchschnitt, Min, Max), Tageswerte gehen um Mitternacht in "Vortag".
  # Die Dauer liefert der Blueprint mit dem Ereignis "heat_pump_valve_sync_run_end", bereits um
  # die Ein- und Ausschaltverzögerung bereinigt.
  - triggers:
      - trigger: event
        event_type: heat_pump_valve_sync_run_end
        id: run_end
      - trigger: time
        at: "00:00:00"
        id: midnight
    variables:
      today: "{{ now().date().isoformat() }}"
      a: "{{ this.attributes if this is defined and this.attributes else {} }}"
      rolled: "{{ a.day is defined and a.day != today }}"
      old: "{{ (a.durations | default([], true)) if rolled else [] }}"
      durs: "{{ (a.durations | default([], true)) if not rolled else [] }}"
      new_run: >-
        {{ (trigger.event.data.duration_min | float(0)) | round(1)
           if trigger.id == 'run_end' and trigger.event.data.duration_min is defined else none }}
      cur: "{{ durs + ([new_run] if new_run is not none else []) }}"
      yday: >-
        {% if rolled %}
          {{ {'day': a.day,
              'count': old | length,
              'avg': ((old | sum) / (old | length)) | round(1) if old | length > 0 else none,
              'min': old | min if old | length > 0 else none,
              'max': old | max if old | length > 0 else none,
              'total': (old | sum) | round(1)} }}
        {% else %}
          {{ {'day': a.yesterday_day | default(none),
              'count': a.yesterday_count | default(none),
              'avg': a.yesterday_avg | default(none),
              'min': a.yesterday_min | default(none),
              'max': a.yesterday_max | default(none),
              'total': a.yesterday_total | default(none)} }}
        {% endif %}
    sensor:
      - name: "WP Ventil-Sync Lauf Heute"
        unique_id: heat_pump_valve_sync_run_today
        default_entity_id: sensor.heat_pump_valve_sync_run_today
        icon: mdi:timer-outline
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {{ ((cur | sum) / (cur | length)) | round(1) if cur | length > 0 else none }}
        attributes:
          day: "{{ today }}"
          count: "{{ cur | length }}"
          min: "{{ cur | min if cur | length > 0 else none }}"
          max: "{{ cur | max if cur | length > 0 else none }}"
          last_run: "{{ cur | last if cur | length > 0 else none }}"
          total: "{{ (cur | sum) | round(1) }}"
          durations: "{{ cur }}"
          yesterday_day: "{{ yday.day }}"
          yesterday_count: "{{ yday.count }}"
          yesterday_avg: "{{ yday.avg }}"
          yesterday_min: "{{ yday.min }}"
          yesterday_max: "{{ yday.max }}"
          yesterday_total: "{{ yday.total }}"

  - sensor:
      - name: "WP Ventil-Sync Regler mit Bedarf"
        unique_id: heat_pump_valve_sync_demand_count
        default_entity_id: sensor.heat_pump_valve_sync_demand_count
        icon: mdi:radiator
        unit_of_measurement: Regler
        state: >-
          {% set rooms = state_attr('sensor.heat_pump_valve_sync_config', 'rooms') or [] %}
          {% set ns = namespace(n=0) %}
          {% for r in rooms %}
            {% set d = [r.demand] if r.demand is string else (r.demand | default([], true)) %}
            {% set on = namespace(v=false) %}
            {% for e in d %}{% if is_state(e, 'on') %}{% set on.v = true %}{% endif %}{% endfor %}
            {% if on.v %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          regler: >-
            {% set rooms = state_attr('sensor.heat_pump_valve_sync_config', 'rooms') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for r in rooms %}
              {% set d = [r.demand] if r.demand is string else (r.demand | default([], true)) %}
              {% for e in d %}{% if is_state(e, 'on') %}{% set ns.l = ns.l + [state_attr(e, 'friendly_name') or e] %}{% endif %}{% endfor %}
            {% endfor %}
            {{ ns.l }}

      - name: "WP Ventil-Sync Ältester Bedarf"
        unique_id: heat_pump_valve_sync_oldest_demand
        default_entity_id: sensor.heat_pump_valve_sync_oldest_demand
        icon: mdi:timer-sand
        unit_of_measurement: min
        state: >-
          {% set c = 'sensor.heat_pump_valve_sync_config' %}
          {% set rooms = state_attr('sensor.heat_pump_valve_sync_config', 'rooms') or [] %}
          {% set rel = expand(state_attr(c, 'release_helper') or []) | first %}
          {% set run = expand(state_attr(c, 'run_helper') or []) | first %}
          {% set ref0 = 0 %}
          {% if rel is defined and run is defined and rel.state != 'on' and run.state != 'on' %}
            {% set ref0 = [rel.last_changed.timestamp(), run.last_changed.timestamp()] | max %}
          {% endif %}
          {% set ns = namespace(o=0) %}
          {% for r in rooms %}
            {% set d = [r.demand] if r.demand is string else (r.demand | default([], true)) %}
            {% for e in expand(d) | selectattr('state', 'eq', 'on') %}
              {% set age = now().timestamp() - ([e.last_changed.timestamp(), ref0] | max) %}
              {% if age > ns.o %}{% set ns.o = age %}{% endif %}
            {% endfor %}
          {% endfor %}
          {{ (ns.o / 60) | round(0) | int }}

      # Restzeit der Mindestpause. Bezug wie im Blueprint: Ende der letzten Freigabe oder
      # des letzten Laufs, je nachdem, was später war.
      - name: "WP Ventil-Sync Pause Rest"
        unique_id: heat_pump_valve_sync_pause_remaining
        default_entity_id: sensor.heat_pump_valve_sync_pause_remaining
        icon: mdi:pause-circle-outline
        unit_of_measurement: min
        state: >-
          {% set c = 'sensor.heat_pump_valve_sync_config' %}
          {% set mp = state_attr(c, 'min_pause') %}
          {% set rel = expand(state_attr(c, 'release_helper') or []) | first %}
          {% set run = expand(state_attr(c, 'run_helper') or []) | first %}
          {% if mp is not number or rel is not defined or run is not defined %}
            {{ none }}
          {% elif rel.state == 'on' or run.state == 'on' %}
            {{ 0 }}
          {% else %}
            {% set ref = [rel.last_changed, run.last_changed] | max %}
            {{ [(mp * 60 - (now() - ref).total_seconds()) / 60, 0] | max | round(0) | int }}
          {% endif %}

      - name: "WP Ventil-Sync Status"
        unique_id: heat_pump_valve_sync_status
        default_entity_id: sensor.heat_pump_valve_sync_status
        state: >-
          {% set c = 'sensor.heat_pump_valve_sync_config' %}
          {% set h_sync = state_attr(c, 'sync_enabled') %}
          {% set h_run = state_attr(c, 'run_helper') %}
          {% set h_rel = state_attr(c, 'release_helper') %}
          {% set n = states('sensor.heat_pump_valve_sync_demand_count') | int(0) %}
          {% if h_sync is none %}{% set ph = 'nocfg' %}
          {% elif not is_state(h_sync, 'on') %}{% set ph = 'off' %}
          {% elif is_state(h_run, 'on') %}{% set ph = 'run' %}
          {% elif is_state(h_rel, 'on') %}{% set ph = 'rel' %}
          {% elif n == 0 %}{% set ph = 'idle' %}
          {% else %}{% set ph = 'collect' %}{% endif %}
          {% set age = states('sensor.heat_pump_valve_sync_oldest_demand') | int(0) %}
          {% set pause = states('sensor.heat_pump_valve_sync_pause_remaining') | int(0) %}
          {% if ph == 'nocfg' %}Warte auf Einstellungen der Automatisierung
          {% elif ph == 'off' %}Sync aus, Ventile folgen dem Bedarf
          {% elif ph == 'run' %}Lauf, Ventile mit Bedarf offen
          {% elif ph == 'rel' %}Freigabe, Ventile offen, warte auf Verdichter
          {% elif ph == 'idle' %}Ruhe, kein Bedarf
          {% elif pause > 0 %}Sammelt, {{ n }} Regler, Pause noch {{ pause }} min
          {% else %}Sammelt, {{ n }} Regler, ältester seit {{ age }} min
          {% endif %}
        icon: >-
          {% set c = 'sensor.heat_pump_valve_sync_config' %}
          {% set h_sync = state_attr(c, 'sync_enabled') %}
          {% set h_run = state_attr(c, 'run_helper') %}
          {% set h_rel = state_attr(c, 'release_helper') %}
          {% set n = states('sensor.heat_pump_valve_sync_demand_count') | int(0) %}
          {% if h_sync is none %}{% set ph = 'nocfg' %}
          {% elif not is_state(h_sync, 'on') %}{% set ph = 'off' %}
          {% elif is_state(h_run, 'on') %}{% set ph = 'run' %}
          {% elif is_state(h_rel, 'on') %}{% set ph = 'rel' %}
          {% elif n == 0 %}{% set ph = 'idle' %}
          {% else %}{% set ph = 'collect' %}{% endif %}
          {{ {'nocfg': 'mdi:cog-off-outline', 'off': 'mdi:sync-off', 'run': 'mdi:heat-pump',
              'rel': 'mdi:valve-open', 'idle': 'mdi:sleep', 'collect': 'mdi:timer-sand'}[ph] }}
        attributes:
          color: >-
            {% set c = 'sensor.heat_pump_valve_sync_config' %}
            {% set h_sync = state_attr(c, 'sync_enabled') %}
            {% set h_run = state_attr(c, 'run_helper') %}
            {% set h_rel = state_attr(c, 'release_helper') %}
            {% set n = states('sensor.heat_pump_valve_sync_demand_count') | int(0) %}
            {% if h_sync is none %}{% set ph = 'nocfg' %}
            {% elif not is_state(h_sync, 'on') %}{% set ph = 'off' %}
            {% elif is_state(h_run, 'on') %}{% set ph = 'run' %}
            {% elif is_state(h_rel, 'on') %}{% set ph = 'rel' %}
            {% elif n == 0 %}{% set ph = 'idle' %}
            {% else %}{% set ph = 'collect' %}{% endif %}
            {{ {'nocfg': 'grey', 'off': 'grey', 'run': 'orange', 'rel': 'amber',
                'idle': 'green', 'collect': 'blue'}[ph] }}

      # Vortag: Durchschnitt der Lauf-Dauer des Vortags als Zustand, Rest als Attribute.
      - name: "WP Ventil-Sync Lauf Vortag"
        unique_id: heat_pump_valve_sync_run_yesterday
        default_entity_id: sensor.heat_pump_valve_sync_run_yesterday
        icon: mdi:history
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {% set v = state_attr('sensor.heat_pump_valve_sync_run_today', 'yesterday_avg') %}
          {{ v if v is number else none }}
        attributes:
          day: "{{ state_attr('sensor.heat_pump_valve_sync_run_today', 'yesterday_day') }}"
          count: "{{ state_attr('sensor.heat_pump_valve_sync_run_today', 'yesterday_count') }}"
          min: "{{ state_attr('sensor.heat_pump_valve_sync_run_today', 'yesterday_min') }}"
          max: "{{ state_attr('sensor.heat_pump_valve_sync_run_today', 'yesterday_max') }}"
          total: "{{ state_attr('sensor.heat_pump_valve_sync_run_today', 'yesterday_total') }}"

# Starts und Laufzeit des Helfers "Lauf aktiv" seit Mitternacht.
# EINSTELLEN: entity_id auf den Helfer "Lauf aktiv" der Automatisierung setzen
# (history_stats erlaubt hier keine Templates).
# Die Entity-IDs leiten sich aus dem Namen ab (sensor.wp_ventil_sync_starts_heute,
# sensor.wp_ventil_sync_laufzeit_heute).
sensor:
  - platform: history_stats
    name: "WP Ventil-Sync Starts heute"
    unique_id: heat_pump_valve_sync_starts_today
    entity_id: input_boolean.bphelper_ventilsync_lauf_aktiv
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "WP Ventil-Sync Laufzeit heute"
    unique_id: heat_pump_valve_sync_runtime_today
    entity_id: input_boolean.bphelper_ventilsync_lauf_aktiv
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
