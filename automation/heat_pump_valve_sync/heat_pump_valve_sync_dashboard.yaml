                  let n = 0, on = 0;
                  Object.keys(states).forEach(function (k) {
                    if (rx.test(k)) { n++; if (states[k].state === 'on') on++; }
                  });
                  return '<b style="font-size:14px">Erdgeschoss</b><span style="font-size:12px;opacity:0.7;margin-left:10px">' + on + ' von ' + n + ' mit Bedarf</span>';
                ]]]
            styles:
              card:
