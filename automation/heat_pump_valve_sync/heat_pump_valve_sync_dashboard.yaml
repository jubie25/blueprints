# Dashboard "WP Ventil-Sync" (optional), Version 1.6.0
# Voraussetzungen (HACS): mushroom, button-card, card-mod. Package heat_pump_valve_sync_monitor.yaml eingebunden.
# Einrichtung: Neues Dashboard anlegen, dann oben rechts "Dashboard bearbeiten" -> Drei-Punkte-Menü ->
# "Raw-Konfigurationseditor" und den kompletten Inhalt dieser Datei einfügen.
# Hinweis: Der Raw-Editor entfernt Kommentare beim Speichern. Das ist normal.
# Einstellungen (Leistungssensor, Helfer, Bypass- und dauerhaft offene Ventile) kommen aus dem
# Sensor sensor.heat_pump_valve_sync_config des Monitoring-Packages, also aus der Automatisierung.
# Fest eingetragen bleiben: die Raumkacheln (Climate, Bedarf, Ventil), die Kurznamen in
# "Ventile real" und der Helfer "Sync aktiv" im Sync-Chip (zum Umschalten nötig).
title: WP Ventil-Sync
button_card_templates:
  vsync_tile:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      lbl: '[[[ return variables.label ]]]'
      t: |
        [[[
          const c = entity.attributes.current_temperature;
          const s = entity.attributes.temperature;
          if (c === undefined || c === null) return '–';
          return Number(c).toFixed(1) + (s !== undefined && s !== null ? ' / ' + Number(s).toFixed(1) : '') + ' °C';
        ]]]
      s: |
        [[[
          const d = states[variables.demand] && states[variables.demand].state === 'on';
          const v = states[variables.valve] && states[variables.valve].state === 'on';
          if (d && v) return 'heizt';
          if (d) return 'wartet auf Freigabe';
          if (v) return 'Ventil offen ohne Bedarf';
          return 'ruht';
        ]]]
    styles:
      card:
        - padding: 8px 12px
        - border-radius: 12px
        - min-height: 68px
        - background-color: |
            [[[
              const d = states[variables.demand] && states[variables.demand].state === 'on';
              const v = states[variables.valve] && states[variables.valve].state === 'on';
              if (d && v) return 'rgba(255,112,67,0.30)';
              if (d) return 'rgba(255,193,7,0.30)';
              if (v) return 'rgba(66,165,245,0.22)';
              return 'var(--ha-card-background, var(--card-background-color))';
            ]]]
      grid:
        - grid-template-areas: '"lbl t" "s s"'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto auto
        - row-gap: 4px
      custom_fields:
        lbl:
          - justify-self: start
          - font-weight: 600
          - font-size: 14px
        t:
          - justify-self: end
          - font-size: 13px
          - opacity: 0.85
        s:
          - justify-self: start
          - font-size: 12px
          - opacity: 0.75
views:
  - title: Ventil-Sync
    path: ventil-sync
    icon: mdi:valve
    cards:
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.heat_pump_valve_sync_status'') }}'
        secondary: >-
          {% set p = state_attr('sensor.heat_pump_valve_sync_config', 'power_sensor') %}
          WP-Leistung {{ states(p) | float(0) | round(0) if p else '–' }} W
        icon: '{{ state_attr(''sensor.heat_pump_valve_sync_status'', ''icon'') }}'
        icon_color: '{{ state_attr(''sensor.heat_pump_valve_sync_status'', ''color'') }}'
        entity: sensor.heat_pump_valve_sync_status
        multiline_secondary: false
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: input_boolean.bphelper_ventilsync_sync_aktiv
            icon: mdi:sync
            icon_color: '{{ ''green'' if is_state(entity, ''on'') else ''grey'' }}'
            content: Sync {{ 'an' if is_state(entity, 'on') else 'aus' }}
            tap_action:
              action: toggle
          - type: template
            entity: sensor.heat_pump_valve_sync_config
            icon: mdi:heat-pump
            icon_color: >-
              {{ 'orange' if is_state(state_attr(entity, 'run_helper'), 'on') else 'disabled' }}
            content: Lauf
            tap_action:
              action: none
          - type: template
            entity: sensor.heat_pump_valve_sync_config
            icon: mdi:valve-open
            icon_color: >-
              {{ 'amber' if is_state(state_attr(entity, 'release_helper'), 'on') else 'disabled' }}
            content: Freigabe
            tap_action:
              action: none
          - type: template
            entity: sensor.heat_pump_valve_sync_demand_count
            icon: mdi:radiator
            icon_color: '{{ ''blue'' if states(entity) | int(0) > 0 else ''disabled'' }}'
            content: '{{ states(entity) }} mit Bedarf'
            tap_action:
              action: more-info
          - type: template
            entity: sensor.heat_pump_valve_sync_pause_remaining
            icon: mdi:pause-circle-outline
            icon_color: '{{ ''blue'' if states(entity) | int(0) > 0 else ''disabled'' }}'
            content: Pause {{ states(entity) }} min
            tap_action:
              action: more-info
          - type: template
            entity: sensor.wp_ventil_sync_starts_heute
            icon: mdi:counter
            content: '{{ states(entity) }} Starts heute'
            tap_action:
              action: more-info
          - type: template
            entity: sensor.wp_ventil_sync_laufzeit_heute
            icon: mdi:clock-outline
            content: '{{ states(entity) | float(0) | round(1) }} h Laufzeit'
            tap_action:
              action: more-info
          - type: template
            entity: sensor.heat_pump_valve_sync_run_today
            icon: mdi:chart-line
            content: >-
              {% if is_number(states(entity)) %}Ø {{ states(entity) | float(0) | round(0) | int }} min{% else %}Ø –{% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: sensor.heat_pump_valve_sync_run_today
            icon: mdi:arrow-collapse-down
            content: >-
              {% set v = state_attr(entity, 'min') %}Min {{ v | round(0) | int if v is number else '–' }} min
            tap_action:
              action: more-info
          - type: template
            entity: sensor.heat_pump_valve_sync_run_today
            icon: mdi:arrow-collapse-up
            content: >-
              {% set v = state_attr(entity, 'max') %}Max {{ v | round(0) | int if v is number else '–' }} min
            tap_action:
              action: more-info
          - type: template
            entity: sensor.heat_pump_valve_sync_run_yesterday
            icon: mdi:history
            content: >-
              {% if is_number(states(entity)) %}Vortag Ø {{ states(entity) | float(0) | round(0) | int }} min ({{ state_attr(entity, 'min') | round(0) | int }}–{{ state_attr(entity, 'max') | round(0) | int }}){% else %}Vortag –{% endif %}
            tap_action:
              action: more-info
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        triggers_update: all
        custom_fields:
          v: |
            [[[
              const groups = [
                { f: 'UG', v: [
                  { l: 'UGWR', e: 'switch.ugwr_heizventil' },
                  { l: 'Kino F', e: 'switch.kino_heizventil_fenster' },
                  { l: 'Kino T', e: 'switch.kino_heizventil_tuer' },
                  { l: 'UGKü F', e: 'switch.ugkueche_heizventil_fenster' },
                  { l: 'UGKü zK', e: 'switch.ugkueche_heizventil_zkino' },
                  { l: 'UGBad', e: 'switch.ugbad_heizventil' },
                  { l: 'UGFlur', e: 'switch.ugflur_heizventil' },
                ] },
                { f: 'EG', v: [
                  { l: 'EGWK', e: 'switch.egwk_heizventil' },
                  { l: 'EGBad', e: 'switch.egbad_heizventil' },
                  { l: 'EGAZ', e: 'switch.egaz_heizventil' },
                  { l: 'EGWZ F', e: 'switch.egwz_heizventil_fenster' },
                  { l: 'EGWZ T', e: 'switch.egwz_heizventil_tuer' },
                  { l: 'EGEZ F', e: 'switch.egez_heizventil_fenster' },
                  { l: 'EGEZ T', e: 'switch.egez_heizventil_tuer' },
                  { l: 'EGKüche', e: 'switch.egkueche_heizventil' },
                  { l: 'EGFlur', e: 'switch.egflur_heizventil' },
                ] },
                { f: 'OG', v: [
                  { l: 'OGBad', e: 'switch.ogbad_heizventil' },
                  { l: 'OGAZ', e: 'switch.ogaz_heizventil' },
                  { l: 'OGVZ F', e: 'switch.ogvz_heizventil_fenster' },
                  { l: 'OGVZ T', e: 'switch.ogvz_heizventil_tuer' },
                  { l: 'OGJZ F', e: 'switch.ogjz_heizventil_fenster' },
                  { l: 'OGJZ T', e: 'switch.ogjz_heizventil_tuer' },
                  { l: 'OGSZ', e: 'switch.ogsz_heizventil' },
                  { l: 'OGFlur', e: 'switch.ogflur_heizventil' },
                ] },
              ];
              const cfg = states['sensor.heat_pump_valve_sync_config'];
              const A = cfg ? cfg.attributes : {};
              const name = function (e) { return (states[e] && states[e].attributes.friendly_name) || e; };
              const special = (A.bypass_valves || []).concat(A.always_open_valves || [])
                .map(function (e) { return { l: name(e), e: e }; });
              const known = {};
              groups.forEach(function (g) { g.v.forEach(function (x) { known[x.e] = true; }); });
              const extra = special.filter(function (x) { return !known[x.e]; });
              if (extra.length) groups.push({ f: '+', v: extra });
              const isSpecial = {};
              special.forEach(function (x) { isSpecial[x.e] = true; });
              let open = 0, total = 0, rows = '';
              groups.forEach(function (g) {
                let pills = '';
                g.v.forEach(function (x) {
                  const st = states[x.e] ? states[x.e].state : 'unknown';
                  total++;
                  let bg = 'transparent', bd = 'rgba(128,128,128,0.35)', fw = '400';
                  if (st === 'on') { open++; bg = 'rgba(255,112,67,0.35)'; bd = 'rgba(255,112,67,0.9)'; fw = '600'; }
                  else if (st !== 'off') { bg = 'rgba(244,67,54,0.25)'; bd = 'rgba(244,67,54,0.9)'; }
                  const ul = isSpecial[x.e] ? 'text-decoration:underline;' : '';
                  pills += '<span style="margin:2px 3px 2px 0;padding:1px 7px;border-radius:10px;font-size:11px;white-space:nowrap;' + ul + 'font-weight:' + fw + ';background:' + bg + ';border:1px solid ' + bd + '">' + x.l + '</span>';
                });
                rows += '<div style="display:flex;flex-wrap:wrap;align-items:center;margin-top:3px"><b style="width:24px;font-size:11px;opacity:0.7">' + g.f + '</b>' + pills + '</div>';
              });
              return '<div style="font-size:12px;font-weight:600">Ventile real: ' + open + ' von ' + total + ' offen</div>' + rows + '<div style="font-size:10px;opacity:0.6;margin-top:4px">orange = offen, grau = zu, rot = nicht erreichbar, unterstrichen = Bypass / dauerhaft offen</div>';
            ]]]
        styles:
          card:
            - padding: 8px 12px
            - border-radius: 12px
          grid:
            - grid-template-areas: '"v"'
            - grid-template-columns: 1fr
          custom_fields:
            v:
              - justify-self: stretch
              - text-align: left
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          g: |
            [[[
              const items = [
                { c: 'rgba(255,112,67,0.30)', t: 'heizt', d: 'Bedarf und Ventil offen' },
                { c: 'rgba(255,193,7,0.30)', t: 'wartet auf Freigabe', d: 'Bedarf, Ventil zu' },
                { c: 'rgba(66,165,245,0.22)', t: 'Ventil offen ohne Bedarf', d: 'Lauf, Bypass oder dauerhaft offen' },
                { c: 'transparent', t: 'ruht', d: 'kein Bedarf, Ventil zu' },
              ];
              let out = '<div style="display:flex;flex-wrap:wrap;gap:6px 14px">';
              items.forEach(function (x) {
                out += '<div style="display:flex;align-items:center;gap:6px">'
                  + '<span style="width:22px;height:14px;border-radius:4px;flex:none;background:' + x.c + ';border:1px solid rgba(128,128,128,0.5)"></span>'
                  + '<span style="font-size:12px"><b>' + x.t + '</b> <span style="opacity:0.65">' + x.d + '</span></span></div>';
              });
              return out + '</div>';
            ]]]
        styles:
          card:
            - padding: 8px 12px
            - border-radius: 12px
          grid:
            - grid-template-areas: '"g"'
            - grid-template-columns: 1fr
          custom_fields:
            g:
              - justify-self: stretch
              - text-align: left
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              display: block;
              padding: 8px;
              border-radius: 16px;
              background: color-mix(in srgb, #7e8ea0 16%, transparent);
            }
        cards:
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            triggers_update: all
            custom_fields:
              h: |
                [[[
                  const rx = /^input_boolean\.(ug|kino)\w*_heat_demand$/;
                  let n = 0, on = 0;
                  Object.keys(states).forEach(function (k) {
                    if (rx.test(k)) { n++; if (states[k].state === 'on') on++; }
                  });
                  return '<b style="font-size:14px">Untergeschoss</b><span style="font-size:12px;opacity:0.7;margin-left:10px">' + on + ' von ' + n + ' mit Bedarf</span>';
                ]]]
            styles:
              card:
                - padding: 6px 12px
                - background: none
                - box-shadow: none
                - border: none
              grid:
                - grid-template-areas: '"h"'
