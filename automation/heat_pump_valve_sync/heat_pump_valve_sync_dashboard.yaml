            custom_fields:
              m: |
                [[[
                  const items = [];
                  const cfg = states['sensor.heat_pump_valve_sync_config'];
                  if (!cfg) return '<div style="font-size:12px;opacity:0.7">Warte auf die Einstellungen der Automatisierung (sensor.heat_pump_valve_sync_config).</div>';
                  const A = cfg.attributes;
                  const name = function (e) { return (states[e] && states[e].attributes.friendly_name) || e; };
                  (A.bypass_valves || []).forEach(function (e) { items.push({ l: name(e), e: e, t: 'Bypass' }); });
                  (A.always_open_valves || []).forEach(function (e) { items.push({ l: name(e), e: e, t: 'dauerhaft offen' }); });
                  if (!items.length) return '<div style="font-size:12px;opacity:0.7">Keine Bypass- oder dauerhaft offenen Ventile eingetragen.</div>';
                  let out = '<div style="display:flex;flex-wrap:wrap;gap:8px">';
                  items.forEach(function (x) {
                    const st = states[x.e] ? states[x.e].state : 'unknown';
                    let bg = 'rgba(128,128,128,0.12)', bd = 'rgba(128,128,128,0.35)', txt = 'zu';
                    if (st === 'on') { bg = 'rgba(33,150,243,0.25)'; bd = 'rgba(33,150,243,0.9)'; txt = 'offen'; }
                    else if (st !== 'off') { bg = 'rgba(244,67,54,0.25)'; bd = 'rgba(244,67,54,0.9)'; txt = 'nicht erreichbar'; }
                    out += '<div style="flex:1 1 150px;padding:8px 10px;border-radius:12px;background:' + bg + ';border:1px solid ' + bd + '">'
                      + '<div style="font-size:13px;font-weight:600">' + x.l + '</div>'
                      + '<div style="font-size:11px;opacity:0.75">' + x.t + ' · ' + txt + '</div></div>';
                  });
                  return out + '</div>';
                ]]]
            styles:
              card:
                - padding: 8px 12px
                - border-radius: 12px
              grid:
                - grid-template-areas: '"m"'
                - grid-template-columns: 1fr
              custom_fields:
                m:
                  - justify-self: stretch
                  - text-align: left