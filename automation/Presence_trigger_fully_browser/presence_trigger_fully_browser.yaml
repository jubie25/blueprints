blueprint:
  name: presence_trigger_fully_browser
  author: jubie25
  description: |
    **Version 1.1.0** – siehe CHANGELOG im GitHub-Repository.

    Schaltet das Display eines Wallterminals ein, sobald ein Präsenzsensor
    Anwesenheit meldet, und hält es aktiv, solange die Präsenz anhält.

    **Ablauf:**
    1. Präsenzsensor wechselt von `aus` auf `an`.
    2. Beim Start des Ablaufs wird der Display-Schalter aus- und (nach kurzer
       Pause) wieder eingeschaltet.
    3. Solange Präsenz erkannt wird, wird in einem festen Intervall der
       "Bewegung/Aktivität auslösen"-Button gedrückt, damit das Terminal
       nicht in den Bildschirmschoner/Standby geht.

    Der Ablauf läuft im Modus `single`: Ein erneuter Trigger während der
    Ablauf noch aktiv ist, startet ihn nicht neu. Dadurch gibt es keinen
    erneuten Aus/Ein-Zyklus am Display (kein Flackern).

    Die Zeiten sind unter "Zeiten & Wiederholungen" anpassbar; die
    Standardwerte entsprechen der ursprünglichen Automation.
  domain: automation
  min_version: 2024.10.0
  source_url: https://github.com/jubie25/blueprints/blob/main/automation/Presence_trigger_fully_browser/presence_trigger_fully_browser.yaml
  input:
    entities:
      name: Entitäten
      icon: mdi:devices
      collapsed: false
      input:
        presence_sensor:
          name: Präsenzsensor
          description: >
            Binary-Sensor, der Anwesenheit im Raum meldet (an = Präsenz).
          selector:
            entity:
              filter:
                - domain: binary_sensor
        display_switch:
          name: Display-Schalter
          description: >
            Schalter, der das Display/den Bildschirm des Wallterminals ein- und ausschaltet.
          selector:
            entity:
              filter:
                - domain: switch
        motion_button:
          name: Button "Bewegung/Aktivität auslösen"
          description: >
            Button, der am Terminal eine Aktivität simuliert und so den
            Bildschirm wach hält.
          selector:
            entity:
              filter:
                - domain: button
    timing:
      name: Zeiten & Wiederholungen
      icon: mdi:timer-cog-outline
      description: Optional. Die Standardwerte entsprechen der ursprünglichen Automation.
      collapsed: true
      input:
        display_off_on_delay:
          name: Pause zwischen Aus und Ein
          description: >
            Wartezeit zwischen dem Ausschalten und dem erneuten Einschalten
            des Displays (Display-Reset beim Start der Präsenz).
          default:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 300
          selector:
            duration:
              enable_millisecond: true
        press_count:
          name: Anzahl Button-Betätigungen je Zyklus
          description: Wie oft der Aktivitäts-Button pro Zyklus gedrückt wird.
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: box
        press_interval:
          name: Pause zwischen Button-Betätigungen
          default:
            hours: 0
            minutes: 0
            seconds: 2
            milliseconds: 0
          selector:
            duration:
              enable_millisecond: true
        cycle_interval:
          name: Wartezeit zwischen den Zyklen
          description: >
            Pause nach jedem Zyklus, bevor erneut geprüft wird, ob noch
            Präsenz besteht. Sollte kleiner als die Display-Timeout-Zeit
            des Terminals sein.
          default:
            hours: 0
            minutes: 0
            seconds: 51
            milliseconds: 0
          selector:
            duration:
              enable_millisecond: true

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input presence_sensor
    from: "off"
    to: "on"
    id: Presence

conditions: []

actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: !input display_switch
    continue_on_error: true
  - delay: !input display_off_on_delay
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: !input display_switch
    continue_on_error: true
  - repeat:
      while:
        - condition: state
          entity_id: !input presence_sensor
          state: "on"
      sequence:
        - repeat:
            count: !input press_count
            sequence:
              - action: button.press
                metadata: {}
                data: {}
                target:
                  entity_id: !input motion_button
                continue_on_error: true
              - delay: !input press_interval
        - delay: !input cycle_interval
