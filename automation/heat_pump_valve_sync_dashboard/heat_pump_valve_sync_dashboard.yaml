            entity: climate.ugbad_thermostat
            variables:
              label: "UGBad"
              demand: input_boolean.ugbad_heat_demand
              valve: switch.ugbad_heizventil
          - type: custom:button-card
            template: vsync_tile
            entity: climate.ugflur_thermostat
            variables:
              label: "UGFlur"
              demand: input_boolean.ugflur_heat_demand
              valve: switch.ugflur_heizventil
      - type: heading
        heading: Erdgeschoss
        heading_style: title
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: vsync_tile
